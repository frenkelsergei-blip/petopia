<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=contain"><meta name="theme-color" content="#182952"><meta name="apple-mobile-web-app-capable" content="yes"><title>$GODOT_PROJECT_NAME</title>$GODOT_HEAD_INCLUDE
<style>html,body{margin:0;position:fixed;inset:0;overflow:hidden;background:#182952;overscroll-behavior:none}#canvas{position:fixed;top:0;left:0;display:block;touch-action:none;outline:none}#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#182952;background:#fff3d9;font:18px system-ui;text-align:center;padding:24px}h1{font-size:42px;margin:0}progress{width:min(300px,85vw);height:22px;accent-color:#459ddd}#version{font-size:14px}#retry{min-width:140px;min-height:48px;font:inherit;border:3px solid #65432e;border-radius:12px;background:#ffc84b;color:#182952}#notice{max-width:500px}</style></head>
<body><canvas id="canvas" tabindex="0" aria-label="PETOPIA game"></canvas><div id="loading"><h1>PETOPIA</h1><div>Little friends, big adventures</div><div id="version"></div><progress id="progress" max="100" value="0"></progress><div id="notice">Loading your adventure…</div><button id="retry" hidden>Try again</button></div><noscript>Enable JavaScript to play PETOPIA.</noscript><script src="$GODOT_URL"></script><script>
const config=$GODOT_CONFIG;
const progress=document.querySelector('#progress');
const notice=document.querySelector('#notice');
const gameCanvas=document.querySelector('#canvas');
// The page sizes the canvas to the area actually visible, and Godot follows
// the canvas (resize policy 0). Phones report a stale or toolbar-inclusive
// window height after rotation, which pushed the bottom of the game off-screen.
function fit(){
 const typing=['INPUT','TEXTAREA'].includes(document.activeElement?.tagName); // the game moves itself above the keyboard
 const view=window.visualViewport;
 const w=Math.round(view&&view.scale===1?view.width:innerWidth);
 const h=Math.round(view&&view.scale===1&&!typing?view.height:innerHeight);
 const ratio=window.devicePixelRatio||1;
 gameCanvas.style.width=w+'px';gameCanvas.style.height=h+'px';
 if(gameCanvas.width!==Math.round(w*ratio)||gameCanvas.height!==Math.round(h*ratio)){gameCanvas.width=Math.round(w*ratio);gameCanvas.height=Math.round(h*ratio);}
 if(scrollX||scrollY)scrollTo(0,0);
}
addEventListener('resize',fit);window.visualViewport?.addEventListener('resize',fit);
addEventListener('orientationchange',()=>{for(const delay of [0,150,400,1000])setTimeout(fit,delay);});
fit();
const engine=new Engine({...config,canvasResizePolicy:0,onProgress:(loaded,total)=>{moved=Date.now();if(total)progress.value=Math.max(progress.value,loaded/total*30);}});
document.querySelector('#retry').onclick=()=>location.reload();
// Name each startup step and surface a stall, so a frozen screen says where it stopped.
let step='Loading your adventure',moved=Date.now();
// The last step survives a tab crash (phones reload a page that ran out of
// memory), so the next visit can say where loading stopped.
const MEMORY='petopia-startup-step';
function remember(value){try{value?localStorage.setItem(MEMORY,value):localStorage.removeItem(MEMORY);}catch(e){}}
let previous=null;try{previous=localStorage.getItem(MEMORY);}catch(e){}
function stage(text){step=text;moved=Date.now();notice.textContent=text+'…';remember(text);if(previous)notice.textContent+=' (Last time, loading stopped while: '+previous.toLowerCase()+'.)';}
const watchdog=setInterval(()=>{if(Date.now()-moved>45000){notice.textContent=step+' is taking too long. Check your connection, close other PETOPIA tabs, then tap Try again.';document.querySelector('#retry').hidden=false;}},5000);
function opened(){clearInterval(watchdog);remember(null);progress.value=100;document.querySelector('#loading').remove();document.querySelector('#canvas').focus();}
async function checked(url){const r=await fetch(url);if(!r.ok)throw new Error(`Download failed (${r.status}). Please try again.`);return r;}
// Plain Godot exports (editor Run in Browser, --export-release) have no
// release package; they boot the stock index.pck/index.wasm instead.
async function packaged(){const r=await fetch('release.json');return r.ok?r.json():null;}
// One engine owns the origin's save. A second tab must not mount a stale
// IndexedDB filesystem and later overwrite a newer reward or purchase.
async function claimProfile(){
 if(!window.isSecureContext)throw new Error('PETOPIA needs a secure https:// address (or http://127.0.0.1 on this computer) to keep saves safe.');
 if(!navigator.locks)throw new Error('Please update your browser to play PETOPIA with safe saves.');
 let decide;
 const claimed=new Promise(resolve=>{decide=resolve;});
 navigator.locks.request('petopia-profile-writer',{ifAvailable:true},async lock=>{
  decide(Boolean(lock));
  if(lock)await new Promise(()=>{}); // Browser releases it on close/reload/crash.
 }).catch(()=>decide(false));
 if(!await claimed)throw new Error('PETOPIA is already open in another tab. Close that tab, then tap Try again here.');
}
(async()=>{
 if(location.protocol==='file:')throw new Error('Browsers cannot start PETOPIA from a file. Run python3 tools/serve_web.py and open http://127.0.0.1:8877/');
 stage('Checking for other PETOPIA tabs');
 await claimProfile();
 if(typeof DecompressionStream==='undefined')throw new Error('Please update Safari or Chrome to play PETOPIA.');
 const missing=Engine.getMissingFeatures({threads:false});if(missing.length)throw new Error('Please use a current Safari, Chrome or Firefox browser. Missing: '+missing.join(', '));
 stage('Checking the game version');
 const release=await packaged();
 if(!release){
  stage('Downloading the game');
  await engine.startGame();
  opened();
  return;
 }
 document.querySelector('#version').textContent='v'+release.version;
 const manifest=await(await checked('game-pack.json')).json();
 // Engine code first, then the game pack: phones never compile 37 MB of
 // WebAssembly while also holding the 42 MB pack.
 stage('Preparing the game engine');
 await engine.init('index');
 stage('Downloading the game');
 let completed=0;
 // Each part lands directly in the one pack buffer, so phones never hold the
 // parts and the assembled pack at the same time.
 const pack=new Uint8Array(manifest.bytes);
 const offsets=[];manifest.parts.reduce((at,part)=>{offsets.push(at);return at+part.bytes;},0);
 await Promise.all(manifest.parts.map(async(part,index)=>{const bytes=new Uint8Array(await(await checked(part.file)).arrayBuffer());if(bytes.length!==part.bytes)throw new Error('The download was incomplete. Please try again.');pack.set(bytes,offsets[index]);completed+=bytes.length;moved=Date.now();progress.value=Math.max(progress.value,30+completed/manifest.bytes*60);}));
 stage('Checking the download');
 const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',pack)),b=>b.toString(16).padStart(2,'0')).join('');
 if(digest!==manifest.sha256)throw new Error('The download was incomplete. Please try again.');
 await engine.preloadFile(pack,'index.pck');
 progress.value=95;stage('Opening your saved game');
 await engine.start({args:['--main-pack','index.pck']});
 opened();
})().catch(error=>{clearInterval(watchdog);remember(null);console.error(error);notice.textContent=error.message||'Could not start the game. Please try again.';document.querySelector('#retry').hidden=false;});
</script></body></html>
