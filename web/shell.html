<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#78bde8"><meta name="apple-mobile-web-app-capable" content="yes"><title>$GODOT_PROJECT_NAME</title>$GODOT_HEAD_INCLUDE
<style>
/* A57 (P59): the loading screen from concept P59, pieces from assets/ui/loading-p32. */
@font-face{font-family:Lilita;src:url(loading/lilita.ttf) format("truetype");font-display:swap}
html,body{margin:0;position:fixed;inset:0;overflow:hidden;background:#78bde8;overscroll-behavior:none}
#canvas{position:fixed;top:0;left:0;display:block;touch-action:none;outline:none}
#loading{--u:min(1vw,1.55vh);position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.2);color:#182952;text-align:center;
 padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
 background:#78bde8 url(loading/meadow.jpg) center/cover no-repeat;font:16px/1.3 Lilita,"Trebuchet MS",system-ui,sans-serif;box-sizing:border-box}
@media (orientation:portrait){#loading{--u:min(1.9vw,1.1vh)}}
#loading .logo{width:calc(var(--u)*40);max-width:86vw;height:auto;filter:drop-shadow(0 6px 8px rgba(40,30,10,.25))}
#loading .card{position:relative;width:calc(var(--u)*46);max-width:90vw;aspect-ratio:679/204;box-sizing:border-box;background:url(loading/card.png) center/100% 100% no-repeat;
 display:grid;align-content:center;gap:calc(var(--u)*.9);padding:calc(var(--u)*3) calc(var(--u)*4) calc(var(--u)*2.4);margin-top:calc(var(--u)*9);filter:drop-shadow(0 6px 8px rgba(40,30,10,.22))}
#loading .fox{position:absolute;left:50%;bottom:calc(100% - var(--u)*2.6);width:calc(var(--u)*20);transform:translateX(-50%);transform-origin:50% 100%;animation:peek 2.4s ease-in-out infinite;pointer-events:none}
@keyframes peek{0%,100%{transform:translateX(-50%) translateY(0) rotate(0)}50%{transform:translateX(-50%) translateY(calc(var(--u)*-.7)) rotate(-2deg)}}
@media (prefers-reduced-motion:reduce){#loading .fox{animation:none}}
.bar{position:relative;height:calc(var(--u)*3.6);background:url(loading/track.png) center/100% 100% no-repeat}
.bar span{position:absolute;left:1.5%;top:12%;bottom:12%;width:0;max-width:97%;border-radius:999px;background:url(loading/fill.png) left center/calc(var(--u)*36.9) 100% no-repeat;transition:width .25s}
.bar span::after{content:"";position:absolute;right:calc(var(--u)*-1.6);top:50%;width:calc(var(--u)*3.6);aspect-ratio:118/112;transform:translateY(-50%);background:url(loading/paw.png) center/contain no-repeat}
#notice{font-size:calc(var(--u)*2.3)}
#version{font-size:calc(var(--u)*1.5);color:#3c4a6a;letter-spacing:.04em}
.row{display:grid;justify-items:center;gap:calc(var(--u)*1)}
#play{width:calc(var(--u)*30);max-width:80vw;aspect-ratio:625/168;font:inherit;font-size:calc(var(--u)*4);color:#fff6e0;border:0;background:url(loading/play.png) center/100% 100% no-repeat;cursor:pointer;text-shadow:0 2px 0 rgba(30,60,20,.35);filter:drop-shadow(0 5px 6px rgba(30,40,10,.25))}
#newsbtn,#newsclose{width:calc(var(--u)*18);max-width:60vw;aspect-ratio:308/92;font:inherit;font-size:calc(var(--u)*2.3);color:#182952;border:0;background:url(loading/news.png) center/100% 100% no-repeat;cursor:pointer;filter:drop-shadow(0 4px 5px rgba(30,40,10,.2))}
#newsclose{min-height:48px;justify-self:center}
#play,#newsbtn{min-height:48px}
#play:active,#newsbtn:active,#newsclose:active{transform:translateY(2px)}
#play:focus-visible,#newsbtn:focus-visible,#newsclose:focus-visible{outline:3px solid #2e7dc2;outline-offset:3px}
#newspanel{position:fixed;inset:0;display:grid;place-items:center;background:rgba(24,41,82,.35);padding:20px}
#newspanel[hidden]{display:none}
#newspanel .card{aspect-ratio:auto;width:min(560px,90vw);max-height:80vh;margin:0;padding:28px 30px;background-size:100% 100%;gap:12px}
#newstitle{font-size:26px;text-align:center}
#news{text-align:left;font:15px/1.4 system-ui,sans-serif;color:#28324a;margin:0;padding:0 0 0 18px;max-height:52vh;overflow:auto}
#retry{justify-self:center;width:calc(var(--u)*20);aspect-ratio:308/92;min-height:48px;font:inherit;font-size:calc(var(--u)*2.2);color:#182952;border:0;background:url(loading/news.png) center/100% 100% no-repeat}
</style></head>
<body><div id="safe-probe" style="position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)"></div><canvas id="canvas" tabindex="0" aria-label="PETOPIA game"></canvas><div id="loading"><img class="logo" src="loading/logo.png" alt="PETOPIA"><div class="card"><img class="fox" src="loading/fox.png" alt=""><div class="bar" role="progressbar" aria-label="Loading"><span id="fill"></span></div><div id="notice">Loading your adventure…</div><div id="version"></div><button id="retry" hidden>Try again</button></div><div class="row" id="ready" hidden><button id="play" type="button">Play now</button><button id="newsbtn" type="button">What's new</button></div><div id="newspanel" hidden><div class="card"><div id="newstitle">What's new</div><ul id="news"></ul><button id="newsclose" type="button">Close</button></div></div></div><noscript>Enable JavaScript to play PETOPIA.</noscript><script>
/* Sound on phones: play as media (iPhone silent switch does not mute the game) and
   wake every audio context inside a real tap, which iOS and Chrome require. */
(function(){
 try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
 const AC=window.AudioContext||window.webkitAudioContext;const list=window.__petopiaAudio=[];
 if(AC){const W=function(...a){const c=new AC(...a);list.push(c);return c;};W.prototype=AC.prototype;window.AudioContext=W;if(window.webkitAudioContext)window.webkitAudioContext=W;}
 let primed=false;
 window.petopiaUnlockAudio=function(){
  for(const c of list)if(c.state!=='running')c.resume().catch(()=>{});
  if(!primed){primed=true;try{const a=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=');a.play().catch(()=>{});}catch(e){}}
 };
 for(const e of ['pointerdown','touchend','keydown','click'])addEventListener(e,window.petopiaUnlockAudio,{capture:true,passive:true});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)for(const c of list)if(c.state==='suspended')c.resume().catch(()=>{});});
})();
</script><script src="$GODOT_URL"></script><script>
const config=$GODOT_CONFIG;
const fillBar=document.querySelector('#fill');
const progress={v:0,get value(){return this.v},set value(x){this.v=x;fillBar.style.width=Math.min(100,x)+'%'}};
const notice=document.querySelector('#notice');
const gameCanvas=document.querySelector('#canvas');
// The page sizes the canvas to the area actually visible, and Godot follows
// the canvas (resize policy 0). Phones report a stale or toolbar-inclusive
// window height after rotation, which pushed the bottom of the game off-screen.
// The game fills the whole screen (viewport-fit=cover); the notch and home
// bar insets are handed to the game so only its buttons stay clear of them.
function readSafe(){const p=getComputedStyle(document.querySelector('#safe-probe'));window.petopiaSafe=[parseFloat(p.paddingLeft)||0,parseFloat(p.paddingTop)||0,parseFloat(p.paddingRight)||0,parseFloat(p.paddingBottom)||0,innerWidth,innerHeight];}
function fit(){
 readSafe();
 const typing=['INPUT','TEXTAREA'].includes(document.activeElement?.tagName); // the game moves itself above the keyboard
 const view=window.visualViewport;
 const w=Math.round(view&&view.scale===1?view.width:innerWidth);
 const h=Math.round(view&&view.scale===1&&!typing?view.height:innerHeight);
 const ratio=window.devicePixelRatio||1;
 gameCanvas.style.width=w+'px';gameCanvas.style.height=h+'px';
 if(gameCanvas.width!==Math.round(w*ratio)||gameCanvas.height!==Math.round(h*ratio)){gameCanvas.width=Math.round(w*ratio);gameCanvas.height=Math.round(h*ratio);}
 if(scrollX||scrollY)scrollTo(0,0);
}
addEventListener('resize',fit);window.visualViewport?.addEventListener('resize',fit);
addEventListener('orientationchange',()=>{for(const delay of [0,150,400,1000])setTimeout(fit,delay);});
fit();
const engine=new Engine({...config,canvasResizePolicy:0,onProgress:(loaded,total)=>{moved=Date.now();if(total)progress.value=Math.max(progress.value,loaded/total*30);}});
document.querySelector('#retry').onclick=()=>location.reload();
// Name each startup step and surface a stall, so a frozen screen says where it stopped.
let step='Loading your adventure',moved=Date.now();
// The last step survives a tab crash (phones reload a page that ran out of
// memory), so the next visit can say where loading stopped.
const MEMORY='petopia-startup-step';
function remember(value){try{value?localStorage.setItem(MEMORY,value):localStorage.removeItem(MEMORY);}catch(e){}}
let previous=null;try{previous=localStorage.getItem(MEMORY);}catch(e){}
function stage(text){step=text;moved=Date.now();notice.textContent=text+'…';remember(text);if(previous)notice.textContent+=' (Last time, loading stopped while: '+previous.toLowerCase()+'.)';}
const watchdog=setInterval(()=>{if(Date.now()-moved>45000){notice.textContent=step+' is taking too long. Check your connection, close other PETOPIA tabs, then tap Try again.';document.querySelector('#retry').hidden=false;}},5000);
// Loaded: show Play now (and What's new) instead of jumping straight in.
// The tap also lets phones start sound.
function opened(){clearInterval(watchdog);remember(null);progress.value=100;
 document.querySelector('.bar').hidden=true;notice.textContent='Ready! Foxy is waiting.';
 const ready=document.querySelector('#ready');ready.hidden=false;
 if(!document.querySelector('#news').children.length)document.querySelector('#newsbtn').hidden=true;
 const play=document.querySelector('#play');play.focus();
 play.onclick=()=>{window.petopiaUnlockAudio&&window.petopiaUnlockAudio();document.querySelector('#loading').remove();document.querySelector('#canvas').focus();};}
document.querySelector('#newsbtn').onclick=()=>{document.querySelector('#newspanel').hidden=false;document.querySelector('#newsclose').focus();};
document.querySelector('#newsclose').onclick=()=>{document.querySelector('#newspanel').hidden=true;document.querySelector('#newsbtn').focus();};
async function checked(url){const r=await fetch(url);if(!r.ok)throw new Error(`Download failed (${r.status}). Please try again.`);return r;}
// Plain Godot exports (editor Run in Browser, --export-release) have no
// release package; they boot the stock index.pck/index.wasm instead.
async function packaged(){const r=await fetch('release.json');return r.ok?r.json():null;}
// One engine owns the origin's save. A second tab must not mount a stale
// IndexedDB filesystem and later overwrite a newer reward or purchase.
async function claimProfile(){
 if(!window.isSecureContext)throw new Error('PETOPIA needs a secure https:// address (or http://127.0.0.1 on this computer) to keep saves safe.');
 if(!navigator.locks)throw new Error('Please update your browser to play PETOPIA with safe saves.');
 let decide;
 const claimed=new Promise(resolve=>{decide=resolve;});
 navigator.locks.request('petopia-profile-writer',{ifAvailable:true},async lock=>{
  decide(Boolean(lock));
  if(lock)await new Promise(()=>{}); // Browser releases it on close/reload/crash.
 }).catch(()=>decide(false));
 if(!await claimed)throw new Error('PETOPIA is already open in another tab. Close that tab, then tap Try again here.');
}
(async()=>{
 if(location.protocol==='file:')throw new Error('Browsers cannot start PETOPIA from a file. Run python3 tools/serve_web.py and open http://127.0.0.1:8877/');
 stage('Checking for other PETOPIA tabs');
 await claimProfile();
 if(typeof DecompressionStream==='undefined')throw new Error('Please update Safari or Chrome to play PETOPIA.');
 const missing=Engine.getMissingFeatures({threads:false});if(missing.length)throw new Error('Please use a current Safari, Chrome or Firefox browser. Missing: '+missing.join(', '));
 stage('Checking the game version');
 const release=await packaged();
 if(!release){
  stage('Downloading the game');
  await engine.startGame();
  opened();
  return;
 }
 document.querySelector('#version').textContent='Version '+release.version;
 if(release.notes&&release.notes.length){const ul=document.querySelector('#news');for(const n of release.notes.slice(0,5)){const li=document.createElement('li');li.textContent=n;ul.appendChild(li);}}
 const manifest=await(await checked('game-pack.json')).json();
 // Engine code first, then the game pack: phones never compile 37 MB of
 // WebAssembly while also holding the 42 MB pack.
 stage('Preparing the game engine');
 await engine.init('index');
 stage('Downloading the game');
 let completed=0;
 // Each part streams straight into the one pack buffer, so phones never hold
 // a part and the assembled pack side by side.
 const pack=new Uint8Array(new ArrayBuffer(manifest.bytes));
 async function hex(bytes){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');}
 let at=0;
 for(const part of manifest.parts){
  const start=at,reader=(await checked(part.file)).body.getReader();
  for(;;){
   const {done,value}=await reader.read();if(done)break;
   if(at+value.length>start+part.bytes)throw new Error('The download was incomplete. Please try again.');
   pack.set(value,at);at+=value.length;completed+=value.length;moved=Date.now();
   progress.value=Math.max(progress.value,30+completed/manifest.bytes*60);
  }
  if(at-start!==part.bytes||(part.sha256&&await hex(pack.subarray(start,at))!==part.sha256))throw new Error('The download was incomplete. Please try again.');
 }
 stage('Handing the game to the engine');
 // Pass the raw ArrayBuffer, never a Uint8Array view: the engine looks the
 // file up in config.fileSizes[file], and a view used as a key is turned into
 // a 41-million-number text string. That string alone (over 1 GB) closed the
 // tab on phones in 0.2.0-0.2.5. tests/web_shell checks this stays a buffer.
 await engine.preloadFile(pack.buffer,'index.pck');
 progress.value=95;stage('Opening your saved game');
 await engine.start({args:['--main-pack','index.pck']});
 opened();
})().catch(error=>{clearInterval(watchdog);remember(null);console.error(error);notice.textContent=error.message||'Could not start the game. Please try again.';document.querySelector('#retry').hidden=false;});
</script></body></html>
